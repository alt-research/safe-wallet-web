name: Deploy to K8s ECR

on:
  push:
    branches:
      - k8s-deployment
  workflow_dispatch:
    inputs:
      tag_suffix:
        description: 'Additional tag suffix (optional)'
        required: false
        default: ''

concurrency:
  group: deploy-k8s-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push-ecr:
    runs-on: ubuntu-latest
    name: Build and Push to ECR

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Set image tags
        id: tags
        run: |
          ECR_REGISTRY="305587085711.dkr.ecr.us-west-2.amazonaws.com"
          ECR_REPOSITORY="safe-wallet-web"
          SHORT_SHA=$(git rev-parse --short HEAD)

          TAGS="${ECR_REGISTRY}/${ECR_REPOSITORY}:k8s-latest"
          TAGS="${TAGS},${ECR_REGISTRY}/${ECR_REPOSITORY}:k8s-${SHORT_SHA}"

          if [ -n "${{ github.event.inputs.tag_suffix }}" ]; then
            TAGS="${TAGS},${ECR_REGISTRY}/${ECR_REPOSITORY}:k8s-${{ github.event.inputs.tag_suffix }}"
          fi

          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image details
        run: |
          echo "✅ Image pushed to ECR"
          echo ""
          echo "Images:"
          echo "  - 305587085711.dkr.ecr.us-west-2.amazonaws.com/safe-wallet-web:k8s-latest"
          echo "  - 305587085711.dkr.ecr.us-west-2.amazonaws.com/safe-wallet-web:k8s-${{ steps.tags.outputs.short_sha }}"
          echo ""
          echo "To use in Kubernetes:"
          echo "  ui:"
          echo "    image: 305587085711.dkr.ecr.us-west-2.amazonaws.com/safe-wallet-web:k8s-latest"
          echo "    containerPort: 8080"
          echo ""
          echo "Git commit: ${{ github.sha }}"
          echo "Short SHA: ${{ steps.tags.outputs.short_sha }}"

      - name: Create deployment summary
        run: |
          echo "## 🚀 K8s Deployment Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ steps.tags.outputs.short_sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Images:**" >> $GITHUB_STEP_SUMMARY
          echo "- \`305587085711.dkr.ecr.us-west-2.amazonaws.com/safe-wallet-web:k8s-latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`305587085711.dkr.ecr.us-west-2.amazonaws.com/safe-wallet-web:k8s-${{ steps.tags.outputs.short_sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Update GitOps HelmRelease:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`yaml" >> $GITHUB_STEP_SUMMARY
          echo "ui:" >> $GITHUB_STEP_SUMMARY
          echo "  image: 305587085711.dkr.ecr.us-west-2.amazonaws.com/safe-wallet-web:k8s-latest" >> $GITHUB_STEP_SUMMARY
          echo "  containerPort: 8080" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
