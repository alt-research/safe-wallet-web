name: Build and Push to ECR

on:
  push:
    tags:
      - 'v*'       # Matches version tags like v1.0.0, v2.1.3
      - '*-orbit'  # Matches orbit-specific tags like v1.0.0-orbit
      - '*-lyra'   # Matches lyra-specific tags like v1.0.0-lyra

env:
  ECR_REPO: 305587085711.dkr.ecr.us-west-2.amazonaws.com/safe-wallet-web

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Debug GitHub Context
        run: |
          echo "Ref: ${{ github.ref }}"
          echo "Ref name: ${{ github.ref_name }}"
          echo "Tag name: ${{ github.ref_name }}"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ECR_REPO }}
          username: ${{ secrets.ECR_ACCESS_KEY_ID }}
          password: ${{ secrets.ECR_ACCESS_KEY }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ECR_REPO }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create deployment summary
        run: |
          echo "## 🚀 Safe Wallet Web - ECR Image Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Git Tag:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**ECR Images:**" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.ECR_REPO }}:${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.ECR_REPO }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Update GitOps HelmRelease:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`yaml" >> $GITHUB_STEP_SUMMARY
          echo "ui:" >> $GITHUB_STEP_SUMMARY
          echo "  image: ${{ env.ECR_REPO }}:${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "  containerPort: 8080" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Chains included in this build:**" >> $GITHUB_STEP_SUMMARY
          echo "- See \`.k8s/CHAINS.md\` for full list" >> $GITHUB_STEP_SUMMARY
